<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charu & Koushik · 10 May 2026</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* ── Reset & base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; } /* GSAP controls scroll, not CSS */

    /* ── Design tokens ────────────────────────────── */
    :root {
      --ivory:      #fdf8f0;
      --ivory-dark: #f0e6d2;
      --ivory-bright: #fffdf8;
      --brown:      #2a1e12;
      --brown-mid:  #7a6a5a;
      --gold:       #c9a87a;
      --gold-light: #e8d5bc;
      --orange:     #e07840;

      --font-serif:  'Cormorant Garamond', Georgia, serif;
      --font-sc:     'Cormorant SC', Georgia, serif;
      --font-script: 'Great Vibes', cursive;
    }

    body {
      background: var(--ivory);
      color: var(--brown);
      font-family: var(--font-serif);
      overflow-x: hidden;
    }

    /* ── SVG paper grain filter (defined once, used everywhere) ── */
    .grain-filter { position: absolute; width: 0; height: 0; }

    /* ── Hero / Envelope ─────────────────────── */
    #hero {
      position: relative;
      height: 100vh; /* GSAP will pin and expand this */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Warm radial vignette behind envelope */
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%,
        transparent 40%, rgba(212, 184, 120, 0.08) 100%);
      pointer-events: none;
    }

    .envelope-scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      perspective: 900px;
    }

    .envelope {
      position: relative;
      width: 480px;
      height: 320px;
      filter: url(#grain) drop-shadow(0 20px 80px rgba(0,0,0,0.18));
      transform-style: preserve-3d;
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: var(--ivory);
      border: 1.5px solid var(--gold);
      border-radius: 2px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.18);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Triangular envelope flap — CSS clip-path triangle */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: var(--ivory-dark);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1.5px solid var(--gold);
      transform-origin: top center;
      backface-visibility: hidden;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }

    /* Wax seal */
    .wax-seal {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: var(--ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      animation: sealPulse 3s ease-in-out infinite;
    }

    .wax-initials {
      font-family: var(--font-script);
      font-size: 22px;
      color: var(--gold);
      line-height: 1;
    }

    @keyframes sealPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.04); opacity: 0.85; }
    }

    /* Scroll hint */
    .scroll-hint {
      font-family: var(--font-sc);
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--gold);
      opacity: 1;
      text-transform: uppercase;
    }

    /* ── Responsive: envelope ─────────────────── */
    @media (max-width: 767px) {
      .envelope { width: 320px; height: 220px; }
      .wax-seal { width: 44px; height: 44px; }
      .wax-initials { font-size: 18px; }
    }

    /* ── Letter card ─────────────────────────── */
    .letter-card {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 0;
      top: 0;
      background: var(--ivory-bright);
      border: 1px solid var(--gold-light);
      outline: 1px solid var(--gold);
      outline-offset: -6px;
      border-radius: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 20px;
      /* starts hidden below envelope, GSAP will animate this */
      transform: translateY(70px);
      opacity: 0;
      z-index: 2;
    }

    .arch-motif {
      width: 140px;
      margin-bottom: 4px;
    }

    .letter-blessing {
      font-family: var(--font-sc);
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--gold);
    }

    .letter-monogram {
      font-family: var(--font-script);
      font-size: 44px;
      color: var(--gold);
      line-height: 1;
    }

    .letter-names {
      font-family: var(--font-script);
      font-size: 28px;
      color: var(--brown);
      line-height: 1.2;
    }

    .diamond-divider {
      width: 140px;
      margin: 2px 0;
    }

    .letter-date {
      font-family: var(--font-sc);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--brown-mid);
    }

    @media (max-width: 767px) {
      .letter-card { left: 8px; right: 8px; padding: 14px; gap: 4px; }
      .letter-monogram { font-size: 32px; }
      .letter-names { font-size: 20px; }
      .arch-motif, .diamond-divider { width: 100px; }
    }
  </style>
</head>
<body>

  <!-- Paper grain SVG filter — referenced by filter: url(#grain) -->
  <svg class="grain-filter" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
        <feBlend in="SourceGraphic" in2="grey" mode="multiply" result="blend"/>
        <feComposite in="blend" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>

  <!-- ══════════════════════════════════════════
       SECTION 1 — ENVELOPE REVEAL (HERO)
  ══════════════════════════════════════════ -->
  <section id="hero">
    <div class="envelope-scene">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <div class="wax-seal">
            <span class="wax-initials">KC</span>
          </div>
          <!-- letter card inserted inside body so it clips correctly -->
          <div class="letter-card" aria-hidden="true">
            <!-- Nizami arch top motif -->
            <svg class="arch-motif" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M10,38 Q10,8 100,4 Q190,8 190,38" stroke="#c9a87a" stroke-width="1"/>
              <circle cx="100" cy="4" r="3" fill="#c9a87a" opacity="0.5"/>
              <line x1="10" y1="38" x2="190" y2="38" stroke="#c9a87a" stroke-width="0.7"/>
              <circle cx="45" cy="24" r="2" fill="none" stroke="#c9a87a" stroke-width="0.8"/>
              <circle cx="155" cy="24" r="2" fill="none" stroke="#c9a87a" stroke-width="0.8"/>
            </svg>

            <p class="letter-blessing">॥ Shree Ganeshay Namah ॥</p>
            <p class="letter-monogram">KC</p>
            <p class="letter-names">Charu &amp; Koushik</p>

            <!-- Rajasthani diamond-chain divider -->
            <svg class="diamond-divider" viewBox="0 0 200 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <line x1="0" y1="6" x2="70" y2="6" stroke="#c9a87a" stroke-width="0.7"/>
              <polygon points="80,6 86,2 92,6 86,10" fill="none" stroke="#c9a87a" stroke-width="0.8"/>
              <circle cx="100" cy="6" r="2.5" fill="none" stroke="#c9a87a" stroke-width="0.8"/>
              <polygon points="108,6 114,2 120,6 114,10" fill="none" stroke="#c9a87a" stroke-width="0.8"/>
              <line x1="130" y1="6" x2="200" y2="6" stroke="#c9a87a" stroke-width="0.7"/>
            </svg>

            <p class="letter-date">10 · 05 · 2026</p>
          </div>
        </div>
      </div>
      <p class="scroll-hint">scroll to open</p>
    </div>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.normalizeScroll(true);

    /* ── Envelope reveal ─────────────────────── */
    const envelopeTl = gsap.timeline({
      scrollTrigger: {
        trigger: '#hero',
        start: 'top top',
        end: '+=300%',
        scrub: 1,
        pin: true,
        anticipatePin: 1,
      }
    });

    envelopeTl
      /* 0–15%: scroll hint fades out */
      .to('.scroll-hint', { opacity: 0, duration: 0.15, ease: 'none' }, 0)
      /* 40–70%: flap rotates open, seal pulse stops */
      .to('.wax-seal', { animation: 'none', duration: 0.01 }, 0.39)
      .to('.envelope-flap', {
        rotateX: -180,
        duration: 0.3,
        ease: 'none',
      }, 0.4)
      /* 70–100%: letter card rises and fades in */
      .to('.letter-card', {
        y: -80,
        opacity: 1,
        duration: 0.3,
        ease: 'none',
      }, 0.7);
  </script>

</body>
</html>
